version: '3.9'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: imodel
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile.v3
    image: imodel-web:latest
    command: ["/usr/local/bin/web"]
    environment:
      PORT: "8080"
      ENV: prod
      BOT_TOKEN: ${BOT_TOKEN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://postgres:postgres@db:5432/imodel?sslmode=disable
      ADMIN_PANEL_SECRET: ${ADMIN_PANEL_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      PREVIEW_FIRST: "1"
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"

  worker:
    image: imodel-web:latest
    command: ["/usr/local/bin/worker"]
    environment:
      ENV: prod
      BOT_TOKEN: ${BOT_TOKEN}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://postgres:postgres@db:5432/imodel?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      PREVIEW_FIRST: "1"
    depends_on:
      - db
      - redis

volumes:
  dbdata:
